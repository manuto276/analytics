<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Consent banner preview</title>
  <!--
    Framed by the dashboard's consent editor in a sandbox without allow-same-origin: opaque origin,
    no cookies, no storage. It runs the real tracker banner module (banner.js, copied from
    services/tracker/dist at build time) and preview.js, which renders the configuration the editor
    posts. No inline scripts (the server sends script-src 'self'), no network requests.
  -->
  <link rel="stylesheet" href="preview.css">
  <script src="banner.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <div class="page" aria-hidden="true">
    <div class="nav"><span class="logo"></span><span class="links"><i></i><i></i><i></i></span></div>
    <div class="hero"><b></b><b class="short"></b><p></p><p></p><p class="short"></p></div>
    <div class="cards"><div></div><div></div><div></div></div>
    <p></p><p></p><p class="short"></p>
  </div>
</body>
</html>

                        type: object
                        additionalProperties: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-an_session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: ak_<prefix>_<secret>
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    FunnelId:
      name: funnelId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PublicKey:
      name: publicKey
      in: path
      required: true
      schema: { type: string, pattern: '^pk_[A-Za-z0-9]{21}$' }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    Period:
      name: period
      in: query
      schema: { type: string, enum: [today, yesterday, 7d, 30d, 90d, month, last_month, 12mo, year, custom], default: 30d }
    From:
      name: from
      in: query
      description: Start day (inclusive) in the site time zone; required with period=custom
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: End day (inclusive); required with period=custom
      schema: { type: string, format: date }
    Interval:
      name: interval
      in: query
      schema: { type: string, enum: [hour, day, week, month] }
    Compare:
      name: compare
      in: query
      schema: { type: string, enum: [none, previous_period, previous_year], default: none }
    Filter:
      name: filter
      in: query
      description: 'filter[dim][op]=value, dims: page, entry_page, exit_page, host, channel, source, referrer, utm_source, utm_medium, utm_campaign, utm_content, utm_term, device, browser, os, country, event, content, level; ops: is, is_not, contains, prefix, glob'
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: object
          additionalProperties: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Metric name, prefix with - for descending (default descending by the main metric)
      schema: { type: string, pattern: '^-?[a-z_]{1,32}$' }
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RecoveryCodes:
      description: Recovery codes (shown once)
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
    UserResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/User' }
    SiteResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Site' }
    MembersResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Member' }
    InvitationCreated:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                allOf:
                  - $ref: '#/components/schemas/Invitation'
                  - type: object
                    required: [link]
                    properties:
                      link: { type: string }
    ConsentConfigResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/ConsentConfig' }
    GoalResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Goal' }
    FunnelResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Funnel' }
    CostResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/CampaignCost' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
        retry_after: { type: integer }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    PublicHealth:
      type: object
      required: [status, version, commit]
      properties:
        status: { type: string, enum: [ok, warn, fail] }
        version: { type: string }
        commit: { type: string }
    GlobalRole:
      type: string
      enum: [admin, member]
    SiteRole:
      type: string
      enum: [admin, viewer]
    User:
      type: object
      required: [id, email, pending_email, display_name, global_role, locale, status, mfa_enabled, last_login_at, created_at, site_roles]
      properties:
        id: { type: integer }
        email: { type: string }
        pending_email:
          type: string
          nullable: true
          description: Address requested with POST /auth/email and not yet confirmed.
        display_name: { type: string }
        global_role: { $ref: '#/components/schemas/GlobalRole' }
        locale: { type: string }
        status: { type: string, enum: [active, disabled] }
        mfa_enabled: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        site_roles:
          type: array
          items:
            type: object
            required: [site_id, role]
            properties:
              site_id: { type: integer }
              role: { $ref: '#/components/schemas/SiteRole' }
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok, mfa_required] }
            user: { $ref: '#/components/schemas/User' }
            csrf_token: { type: string }
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, csrf_token, session]
          properties:
            user: { $ref: '#/components/schemas/User' }
            csrf_token: { type: string }
            session:
              type: object
              required: [id, absolute_expires_at]
              properties:
                id: { type: string }
                absolute_expires_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, current, created_at, last_seen_at, ua_summary, ip_prefix]
      properties:
        id: { type: string }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        ua_summary: { type: string, nullable: true }
        ip_prefix: { type: string, nullable: true }
    Invitation:
      type: object
      required: [id, email, global_role, site_roles, status, expires_at, created_at]
      properties:
        id: { type: integer }
        email: { type: string }
        global_role: { $ref: '#/components/schemas/GlobalRole' }
        site_roles:
          type: array
          items:
            type: object
            required: [site_id, role]
            properties:
              site_id: { type: integer }
              role: { $ref: '#/components/schemas/SiteRole' }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user_id, email, display_name, status, global_role, role, inherited]
      properties:
        user_id: { type: integer }
        email: { type: string }
        display_name: { type: string }
        status: { type: string }
        global_role: { $ref: '#/components/schemas/GlobalRole' }
        role: { $ref: '#/components/schemas/SiteRole' }
        inherited: { type: boolean, description: true when access comes from the global admin role }
    SiteDomain:
      type: object
      required: [host, include_subdomains]
      properties:
        host:
          type: string
          description: |
            A host name, or a URL whose host is taken. On input a leading `*.` means "this domain and
            its subdomains" and sets `include_subdomains`; responses always return the bare host.
        include_subdomains: { type: boolean }
    Site:
      type: object
      required: [id, public_key, name, timezone, currency, domains, base_tracking_enabled, visitor_hash_mode, cookie_level_enabled, cookie_domain, visitor_cookie_days, new_visit_on_campaign_change, dnt_mode, respect_gpc, hash_routing, allow_localhost, tracker_global, allowed_query_params, excluded_paths, excluded_ip_prefixes, content_contact_events, auto_events, min_group_size, consent_receipts_enabled, archived, created_at, updated_at, role]
      properties:
        id: { type: integer }
        public_key: { type: string }
        name: { type: string }
        timezone: { type: string }
        currency: { type: string }
        domains:
          type: array
          items: { $ref: '#/components/schemas/SiteDomain' }
        base_tracking_enabled: { type: boolean }
        visitor_hash_mode: { type: string, enum: [daily_hash, pageviews_only] }
        cookie_level_enabled: { type: boolean }
        cookie_domain: { type: string, nullable: true }
        visitor_cookie_days: { type: integer }
        new_visit_on_campaign_change: { type: boolean }
        dnt_mode: { type: string, enum: [ignore, no_cookie, no_tracking] }
        respect_gpc: { type: boolean }
        hash_routing: { type: boolean }
        allow_localhost: { type: boolean }
        tracker_global: { type: string }
        allowed_query_params: { type: array, items: { type: string } }
        excluded_paths: { type: array, items: { type: string } }
        excluded_ip_prefixes: { type: array, items: { type: string } }
        content_contact_events: { type: array, items: { type: string } }
        auto_events:
          type: object
          properties:
            outbound: { type: boolean }
            downloads: { type: boolean }
            forms: { type: boolean }
        min_group_size: { type: integer }
        consent_receipts_enabled: { type: boolean }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        role: { allOf: [{ $ref: '#/components/schemas/SiteRole' }], nullable: true }
        timezone_changed: { type: boolean }
    SiteInput:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        currency: { type: string }
        domains:
          type: array
          items: { $ref: '#/components/schemas/SiteDomain' }
        base_tracking_enabled: { type: boolean }
        visitor_hash_mode: { type: string, enum: [daily_hash, pageviews_only] }
        cookie_level_enabled: { type: boolean }
        cookie_domain: { type: string, nullable: true }
        visitor_cookie_days: { type: integer }
        new_visit_on_campaign_change: { type: boolean }
        dnt_mode: { type: string, enum: [ignore, no_cookie, no_tracking] }
        respect_gpc: { type: boolean }
        hash_routing: { type: boolean }
        allow_localhost: { type: boolean }
        tracker_global: { type: string }
        allowed_query_params: { type: array, items: { type: string } }
        excluded_paths: { type: array, items: { type: string } }
        excluded_ip_prefixes: { type: array, items: { type: string } }
        content_contact_events: { type: array, items: { type: string } }
        auto_events:
          type: object
          properties:
            outbound: { type: boolean }
            downloads: { type: boolean }
            forms: { type: boolean }
        min_group_size: { type: integer }
        consent_receipts_enabled: { type: boolean }
        archived: { type: boolean, description: 'Set to false to restore an archived site (global admin)' }
    ConsentTexts:
      type: object
      required: [title, body, accept, reject, close, policy, reopen]
      properties:
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 1200 }
        accept: { type: string, maxLength: 40 }
        reject: { type: string, maxLength: 40 }
        close: { type: string, maxLength: 40 }
        policy: { type: string, maxLength: 60 }
        reopen: { type: string, maxLength: 60 }
    ConsentTheme:
      type: object
      required: [bg, fg, ac, acf, rad, pos]
      properties:
        bg: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        fg: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        ac: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        acf: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        rad: { type: integer, minimum: 0, maximum: 24 }
        pos: { type: string, enum: [bottom, bottom-left, bottom-right] }
    ConsentConfigInput:
      type: object
      required: [texts, policy_urls, default_locale, theme, accepted_ttl_days, rejected_ttl_days, show_floating_reopen]
      properties:
        texts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ConsentTexts' }
        policy_urls:
          type: object
          additionalProperties: { type: string }
        default_locale: { type: string }
        theme: { $ref: '#/components/schemas/ConsentTheme' }
        accepted_ttl_days: { type: integer, minimum: 1, maximum: 395 }
        rejected_ttl_days: { type: integer, minimum: 1, maximum: 395 }
        show_floating_reopen: { type: boolean }
    ConsentConfig:
      allOf:
        - $ref: '#/components/schemas/ConsentConfigInput'
        - type: object
          required: [id, revision, consent_version, status, created_at, published_at, published_by]
          properties:
            id: { type: integer }
            revision: { type: integer }
            consent_version: { type: integer }
            status: { type: string, enum: [draft, published, archived] }
            created_at: { type: string, format: date-time }
            published_at: { type: string, format: date-time, nullable: true }
            published_by: { type: integer, nullable: true }
            contrast_warnings:
              type: array
              items: { type: string }
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    GoalInput:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [pageview, event, conversion] }
        match:
          type: object
          description: 'pageview: {path: glob}; event: {name, props?: {k: v}}; conversion: {name}'
          properties:
            path: { type: string }
            name: { type: string }
            props:
              type: object
              additionalProperties: { type: string }
    Goal:
      type: object
      required: [id, name, type, match]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [pageview, event, conversion] }
        match:
          type: object
          properties:
            path: { type: string }
            name: { type: string }
            props:
              type: object
              additionalProperties: { type: string }
    FunnelInput:
      type: object
      properties:
        name: { type: string }
        scope: { type: string, enum: [visit, visitor] }
        window_days: { type: integer, minimum: 1, maximum: 90 }
        goal_ids:
          type: array
          minItems: 2
          maxItems: 10
          items: { type: integer }
    Funnel:
      type: object
      required: [id, name, scope, window_days, steps]
      properties:
        id: { type: integer }
        name: { type: string }
        scope: { type: string, enum: [visit, visitor] }
        window_days: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [position, goal_id, goal_name]
            properties:
              position: { type: integer }
              goal_id: { type: integer }
              goal_name: { type: string }
    CampaignCostInput:
      type: object
      properties:
        day_from: { type: string, format: date }
        day_to: { type: string, format: date }
        channel: { type: string, nullable: true }
        utm_source: { type: string, nullable: true }
        utm_medium: { type: string, nullable: true }
        utm_campaign: { type: string, nullable: true }
        amount_minor: { type: integer, minimum: 0 }
        currency: { type: string }
        note: { type: string, nullable: true }
    CampaignCost:
      type: object
      required: [id, day_from, day_to, channel, utm_source, utm_medium, utm_campaign, amount_minor, currency, note, import_batch_id, created_at]
      properties:
        id: { type: integer }
        day_from: { type: string, format: date }
        day_to: { type: string, format: date }
        channel: { type: string, nullable: true }
        utm_source: { type: string, nullable: true }
        utm_medium: { type: string, nullable: true }
        utm_campaign: { type: string, nullable: true }
        amount_minor: { type: integer }
        currency: { type: string }
        note: { type: string, nullable: true }
        import_batch_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CostImportResult:
      type: object
      required: [dry_run, imported, batch_id, valid_rows, invalid_rows, rows]
      properties:
        dry_run: { type: boolean }
        imported: { type: boolean }
        batch_id: { type: string, nullable: true }
        valid_rows: { type: integer }
        invalid_rows: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [line, errors]
            properties:
              line: { type: integer }
              day_from: { type: string, nullable: true }
              day_to: { type: string, nullable: true }
              channel: { type: string, nullable: true }
              utm_source: { type: string, nullable: true }
              utm_medium: { type: string, nullable: true }
              utm_campaign: { type: string, nullable: true }
              amount_minor: { type: integer, nullable: true }
              currency: { type: string, nullable: true }
              note: { type: string, nullable: true }
              errors: { type: array, items: { type: string } }
    ReportMeta:
      type: object
      required: [site_id, range, compare_range, interval, source, availability, generated_at, cache, timezone, currency]
      properties:
        site_id: { type: integer }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        compare_range:
          type: object
          nullable: true
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        interval: { type: string, nullable: true, enum: [hour, day, week, month, null] }
        source: { type: string, enum: [rollup, raw, mixed] }
        availability:
          type: object
          required: [visitors, bounce, duration]
          properties:
            visitors: { type: boolean }
            bounce: { type: boolean }
            duration: { type: boolean }
        generated_at: { type: string, format: date-time }
        cache: { type: string, enum: [hit, miss] }
        timezone: { type: string }
        currency: { type: string }
        next_cursor: { type: string, nullable: true }
    OverviewMetrics:
      type: object
      required: [visitors, visits, pageviews, views_per_visit, bounce_rate, avg_duration_ms, events, conversions, revenue_minor, consented_visits, consent_rate]
      properties:
        visitors: { type: integer, nullable: true }
        visits: { type: integer }
        pageviews: { type: integer }
        views_per_visit: { type: number, nullable: true }
        bounce_rate: { type: number, nullable: true, description: 'Fraction 0–1' }
        avg_duration_ms: { type: integer, nullable: true }
        events: { type: integer }
        conversions: { type: integer }
        revenue_minor: { type: integer }
        consented_visits: { type: integer }
        consent_rate: { type: number, nullable: true, description: 'Fraction 0–1 of visits that ran at the cookie level' }
    TimeseriesPoint:
      type: object
      required: [t, visitors, visits, pageviews, bounce_rate, avg_duration_ms, conversions, revenue_minor]
      properties:
        t: { type: string, description: 'Day/week start/month start as YYYY-MM-DD, or "YYYY-MM-DD HH:00" in the site time zone for interval=hour' }
        visitors: { type: integer, nullable: true }
        visits: { type: integer }
        pageviews: { type: integer }
        bounce_rate: { type: number, nullable: true }
        avg_duration_ms: { type: integer, nullable: true }
        conversions: { type: integer }
        revenue_minor: { type: integer }
    PagesRow:
      type: object
      required: [host, path, pageviews, visits, visitors, entries, exits, bounce_rate, avg_engagement_ms]
      properties:
        host: { type: string, nullable: true }
        path: { type: string, nullable: true }
        pageviews: { type: integer }
        visits: { type: integer, description: Visit-days that saw this page }
        visitors: { type: integer }
        entries: { type: integer }
        exits: { type: integer }
        bounce_rate: { type: number, nullable: true, description: 'Fraction 0–1 of entries on this page that bounced' }
        avg_engagement_ms: { type: integer, nullable: true, description: Engaged milliseconds per pageview }
    LandingPageRow:
      type: object
      required: [host, path, entries, bounces, bounce_rate]
      properties:
        host: { type: string, nullable: true }
        path: { type: string, nullable: true }
        entries: { type: integer }
        bounces: { type: integer }
        bounce_rate: { type: number, nullable: true, description: 'Fraction 0–1' }
    SourcesRow:
      type: object
      required: [channel, source, referrer_host, visits, visitors, pageviews, bounce_rate, avg_duration_ms]
      properties:
        channel: { type: string, nullable: true }
        source: { type: string, nullable: true }
        referrer_host: { type: string, nullable: true }
        visits: { type: integer }
        visitors: { type: integer }
        pageviews: { type: integer }
        bounce_rate: { type: number, nullable: true, description: 'Fraction 0–1' }
        avg_duration_ms: { type: integer, nullable: true }
    CampaignsRow:
      type: object
      required: [utm_source, utm_medium, utm_campaign, utm_content, utm_term, visits, visitors, pageviews, bounce_rate]
      properties:
        utm_source: { type: string, nullable: true }
        utm_medium: { type: string, nullable: true }
        utm_campaign: { type: string, nullable: true }
        utm_content: { type: string, nullable: true }
        utm_term: { type: string, nullable: true }
        visits: { type: integer }
        visitors: { type: integer }
        pageviews: { type: integer }
        bounce_rate: { type: number, nullable: true, description: 'Fraction 0–1' }
    TechRow:
      type: object
      required: [value, visits, visitors, pageviews]
      properties:
        value: { type: string, nullable: true, description: 'Device class, browser family or OS family; null when unknown' }
        visits: { type: integer }
        visitors: { type: integer }
        pageviews: { type: integer }
    CountriesRow:
      type: object
      required: [country, visits, visitors, pageviews]
      properties:
        country: { type: string, nullable: true, description: 'ISO 3166-1 alpha-2; null when unknown' }
        visits: { type: integer }
        visitors: { type: integer }
        pageviews: { type: integer }
    EventsRow:
      type: object
      required: [name, occurrences, visits]
      properties:
        name: { type: string }
        occurrences: { type: integer }
        visits: { type: integer }
    EventPropsRow:
      type: object
      required: [prop_key, prop_value, occurrences, visits]
      properties:
        prop_key: { type: string }
        prop_value: { type: string }
        occurrences: { type: integer }
        visits: { type: integer }
    ContentRow:
      type: object
      required: [content_key, pageviews, visits, visitors, contacts, channels]
      properties:
        content_key: { type: string }
        pageviews: { type: integer }
        visits: { type: integer }
        visitors: { type: integer }
        contacts: { type: integer, description: Events listed in content_contact_events fired on this content }
        channels:
          type: object
          description: visits per channel
          additionalProperties: { type: integer }
    GoalsRow:
      type: object
      required: [goal_id, name, type, conversions, conversion_rate, value_minor]
      properties:
        goal_id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [pageview, event, conversion] }
        conversions: { type: integer }
        conversion_rate: { type: number, nullable: true, description: 'Fraction 0–1 of visits' }
        value_minor: { type: integer, description: Only for conversion goals }
    ConversionsRow:
      type: object
      required: [name, count, value_minor, attributed]
      properties:
        name: { type: string }
        count: { type: integer }
        value_minor: { type: integer, description: Sum of values in the site currency }
        attributed: { type: integer, description: How many of them have an attributed touch }
    Realtime:
      type: object
      required: [active_visitors, pageviews_per_minute, top_pages, top_sources]
      properties:
        active_visitors: { type: integer }
        pageviews_per_minute:
          type: array
          items:
            type: object
            required: [t, pageviews]
            properties:
              t: { type: string, description: '"YYYY-MM-DD HH:MM" minute in the site time zone' }
              pageviews: { type: integer }
        top_pages:
          type: array
          items:
            type: object
            required: [host, path, pageviews]
            properties:
              host: { type: string }
              path: { type: string }
              pageviews: { type: integer }
        top_sources:
          type: array
          items:
            type: object
            required: [channel, source, visits]
            properties:
              channel: { type: string }
              source: { type: string, nullable: true }
              visits: { type: integer }
    FunnelReport:
      type: object
      required: [funnel, entered, completed, conversion_rate, steps, breakdown]
      properties:
        funnel: { $ref: '#/components/schemas/Funnel' }
        entered: { type: integer }
        completed: { type: integer }
        conversion_rate: { type: number, nullable: true }
        steps:
          type: array
          items:
            type: object
            required: [position, goal_id, name, count, conversion_rate, drop_off]
            properties:
              position: { type: integer }
              goal_id: { type: integer }
              name: { type: string }
              count: { type: integer }
              conversion_rate: { type: number, nullable: true }
              drop_off: { type: integer }
        breakdown:
          type: array
          items:
            type: object
            required: [value, steps]
            properties:
              value: { type: string }
              steps: { type: array, items: { type: integer } }
    AttributionReport:
      type: object
      required: [model, group, window_days, base, target, rows, totals]
      properties:
        model: { type: string }
        group: { type: string }
        window_days: { type: integer }
        base: { type: string, nullable: true }
        target: { type: string, nullable: true }
        rows:
          type: array
          items:
            type: object
            required: [key, channel, source, utm_campaign, visits, base_conversions, target_conversions, revenue_minor, cost_minor, cac_minor, roas]
            properties:
              key: { type: string }
              channel: { type: string, nullable: true }
              source: { type: string, nullable: true }
              utm_campaign: { type: string, nullable: true }
              visits: { type: integer, nullable: true }
              base_conversions: { type: integer }
              target_conversions: { type: integer }
              revenue_minor: { type: integer }
              cost_minor: { type: integer, nullable: true }
              cac_minor: { type: integer, nullable: true }
              roas: { type: number, nullable: true }
        totals:
          type: object
          required: [base_conversions, target_conversions, revenue_minor, cost_minor, unattributed_share]
          properties:
            base_conversions: { type: integer }
            target_conversions: { type: integer }
            revenue_minor: { type: integer }
            cost_minor: { type: integer }
            unattributed_share: { type: number, nullable: true, description: 'Fraction 0–1 of conversions without an attributed touch' }
    CohortReport:
      type: object
      required: [cohort, rows]
      properties:
        cohort: { type: string, enum: [week, month] }
        rows:
          type: array
          items:
            type: object
            required: [cohort, size, retained]
            properties:
              cohort: { type: string }
              size: { type: integer }
              retained:
                type: array
                description: 'Fraction 0–1 of the cohort active in each period, starting with the cohort period itself'
                items: { type: number, nullable: true }
    ConsentReport:
      type: object
      required: [rows, totals]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [day, consent_version, shown, accepted, rejected, dismissed, reopened]
            properties:
              day: { type: string, format: date }
              consent_version: { type: integer }
              shown: { type: integer }
              accepted: { type: integer }
              rejected: { type: integer }
              dismissed: { type: integer }
              reopened: { type: integer }
        totals:
          type: object
          required: [shown, accepted, rejected, dismissed, reopened, acceptance_rate]
          properties:
            shown: { type: integer }
            accepted: { type: integer }
            rejected: { type: integer }
            dismissed: { type: integer }
            reopened: { type: integer }
            acceptance_rate: { type: number, nullable: true, description: 'Fraction 0–1 of decisions that accepted' }
    JobsStatus:
      type: object
      required: [jobs, rollup_lag_minutes, dirty_days, geo_db_age_days, pending_consent_drafts]
      properties:
        jobs:
          type: array
          items:
            type: object
            required: [job, last_started_at, last_status, last_message, last_duration_ms]
            properties:
              job: { type: string }
              last_started_at: { type: string, format: date-time, nullable: true }
              last_status: { type: string, nullable: true }
              last_message: { type: string, nullable: true }
              last_duration_ms: { type: integer, nullable: true }
        rollup_lag_minutes: { type: integer }
        dirty_days: { type: integer }
        geo_db_age_days: { type: integer, nullable: true }
        pending_consent_drafts:
          type: array
          items:
            type: object
            required: [site_id, site_name]
            properties:
              site_id: { type: integer }
              site_name: { type: string }
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_type, actor_id, actor_email, action, site_id, target_type, target_id, metadata, ip_prefix]
      properties:
        id: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string }
        actor_id: { type: integer, nullable: true }
        actor_email: { type: string, nullable: true }
        action: { type: string }
        site_id: { type: integer, nullable: true }
        target_type: { type: string, nullable: true }
        target_id: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        ip_prefix: { type: string, nullable: true }
    ConversionInput:
      type: object
      required: [id, name]
      properties:
        id: { type: string, maxLength: 128, description: External id; idempotency key per site }
        name: { type: string, pattern: '^[a-z0-9_:.-]{1,64}$' }
        occurred_at: { type: string, format: date-time }
        visitor_id: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
        customer_ref: { type: string, maxLength: 256, description: Opaque customer reference; stored only as a keyed hash }
        value:
          type: object
          required: [amount_minor, currency]
          properties:
            amount_minor: { type: integer }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        props:
          type: object
          maxProperties: 10
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 100 }
              - { type: number }
              - { type: boolean }
        declared_source:
          type: object
          properties:
            utm_source: { type: string, maxLength: 100 }
            utm_medium: { type: string, maxLength: 100 }
            utm_campaign: { type: string, maxLength: 100 }
            channel: { type: string, maxLength: 16 }

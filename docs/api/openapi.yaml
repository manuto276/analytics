openapi: 3.0.3
info:
  title: Analytics API
  version: 1.0.0
  description: |
    JSON API of the self-hosted analytics service. The dashboard SPA is served from the same origin.

    * Dashboard routes use an httpOnly session cookie (`__Host-an_session`) and require the
      `X-CSRF-Token` header (value from `POST /auth/login` or `GET /auth/me`) on every non-GET request.
    * Server routes (`/server/*`) use `Authorization: Bearer ak_<prefix>_<secret>` API keys with scopes.
    * Errors are RFC 9457 problem details (`application/problem+json`) with a stable `code`.
    * Reports expose aggregates only; no endpoint returns individual visitor or conversion rows.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: users
  - name: sites
  - name: consent
  - name: conversions
  - name: reports
  - name: admin
  - name: server
security:
  - session: []
paths:
  /health:
    get:
      tags: [admin]
      summary: Public health status (used by deploy health checks)
      security: []
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHealth' }
        '503':
          description: Failing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHealth' }

  /auth/config:
    get:
      tags: [auth]
      summary: Public client configuration
      security: []
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [version, commit, source_url, mailer_enabled, locales, app_url]
                    properties:
                      version: { type: string }
                      commit: { type: string }
                      source_url: { type: string }
                      mailer_enabled: { type: boolean }
                      locales: { type: array, items: { type: string } }
                      app_url: { type: string }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Signed in, or second factor required. Sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/mfa:
    post:
      tags: [auth]
      summary: Complete sign-in with a TOTP or recovery code (pending session cookie; no CSRF token needed)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Signed in; the session cookie is rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [auth]
      summary: Current user, CSRF token and session
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [auth]
      summary: Update own display name or locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                locale: { type: string, enum: [en, it] }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/password:
    post:
      tags: [auth]
      summary: Change own password (other sessions are revoked)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/email:
    post:
      tags: [auth]
      summary: Start changing the own email address (a confirmation link goes to the new address)
      description: |
        The current password is required. Nothing changes until the link sent to the new address is
        opened; until then the account keeps signing in with the old address and `pending_email` on
        the user shows the requested one. A new request replaces the previous one. Requires a
        configured mailer.

        The link is `{APP_URL}/account/email/confirm?token=…` and is valid for 24 hours.
        Errors: `422` on `current_password` for a wrong password, on `email` for an invalid address
        or the current one; `409 email_taken`; `501 mailer_disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, current_password]
              properties:
                email: { type: string }
                current_password: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Confirmation link sent to the new address
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [pending_email]
                    properties:
                      pending_email: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      summary: Cancel a pending email change
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Cancelled (or nothing was pending) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/email/confirm:
    post:
      tags: [auth]
      summary: Confirm an email change with the token from the link
      description: |
        Public on purpose: the link is opened from the mailbox, possibly on another device, and the
        token is the proof. Every other session of the account is revoked when the address changes
        (a session of the same user making this request is kept), and a notice is sent to the
        previous address. Errors: `410 email_change_token_invalid` for an unknown, used, expired,
        replaced or cancelled token; `409 email_taken` when the address was taken meanwhile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Address changed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [email]
                    properties:
                      email: { type: string }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request a reset link by email (only when a mailer is configured)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Accepted (sent if the account exists)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Password changed; all sessions revoked }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/totp/setup:
    post:
      tags: [auth]
      summary: Start TOTP enrolment
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Secret and QR code (not active until confirmed)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, otpauth_uri, qr_svg]
                    properties:
                      secret: { type: string }
                      otpauth_uri: { type: string }
                      qr_svg: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/totp/confirm:
    post:
      tags: [auth]
      summary: Confirm TOTP enrolment with a first code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/totp:
    delete:
      tags: [auth]
      summary: Disable TOTP (requires the password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Disabled }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/totp/recovery-codes:
    post:
      tags: [auth]
      summary: Regenerate recovery codes
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/sessions:
    get:
      tags: [auth]
      summary: Active sessions of the current user
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      summary: Revoke all other sessions
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{16}$' }
    delete:
      tags: [auth]
      summary: Revoke one session
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [users]
      summary: Show a pending invitation
      security: []
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [email, global_role, sites, expires_at]
                    properties:
                      email: { type: string }
                      global_role: { $ref: '#/components/schemas/GlobalRole' }
                      sites:
                        type: array
                        items:
                          type: object
                          required: [name, role]
                          properties:
                            name: { type: string }
                            role: { $ref: '#/components/schemas/SiteRole' }
                      expires_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [users]
      summary: Accept an invitation, create the account and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, password]
              properties:
                display_name: { type: string }
                password: { type: string }
                locale: { type: string, enum: [en, it] }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /invitations:
    get:
      tags: [users]
      summary: List invitations (global admin)
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [users]
      summary: Create an invitation (global admin); returns a copyable link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                global_role: { $ref: '#/components/schemas/GlobalRole' }
                site_roles:
                  type: array
                  items:
                    type: object
                    required: [site_id, role]
                    properties:
                      site_id: { type: integer }
                      role: { $ref: '#/components/schemas/SiteRole' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '201': { $ref: '#/components/responses/InvitationCreated' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /invitations/{invitationId}:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [users]
      summary: Revoke an invitation (global admin)
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [users]
      summary: List users (global admin)
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Show a user (global admin)
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [users]
      summary: Update role, status or name (global admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                global_role: { $ref: '#/components/schemas/GlobalRole' }
                status: { type: string, enum: [active, disabled] }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /users/{userId}/totp:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [users]
      summary: Reset a user's two-factor authentication (global admin)
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Reset }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /sites:
    get:
      tags: [sites]
      summary: Sites the current user can access
      parameters:
        - { name: archived, in: query, description: '1 includes archived sites in the list (global admins only)', schema: { type: string, enum: ['0', '1'] } }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Site' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [sites]
      summary: Create a site (global admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '201': { $ref: '#/components/responses/SiteResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      summary: Show a site
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/SiteResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [sites]
      summary: Update site settings (site admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/SiteResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sites]
      summary: Archive a site (site admin); data stays until retention removes it
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '204': { description: Archived }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sites/{siteId}/snippet:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      summary: Tracking snippet
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [html, script_url, proxy_html, public_key]
                    properties:
                      html: { type: string }
                      script_url: { type: string }
                      proxy_html: { type: string }
                      public_key: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /sites/{siteId}/members:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      summary: Members of a site (site admin)
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200': { $ref: '#/components/responses/MembersResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [sites]
      summary: Grant an existing user access by email (site admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]

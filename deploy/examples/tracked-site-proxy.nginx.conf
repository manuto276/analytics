# analytics — optional first-party proxy on a TRACKED site (not on the analytics host)
#
# Serves the tracker and its endpoints under the tracked site's own origin, e.g.
#   https://www.example.com/stats/pk_XXXX.js  ->  https://stats.example.net/t/pk_XXXX.js
#   https://www.example.com/stats/e           ->  https://stats.example.net/t/e
# The tracker derives its endpoint from its own `src`, so the page snippet becomes:
#   <script defer src="/stats/pk_XXXX.js"></script>
#
# On the analytics service, list this proxy's egress IP(s) in TRUSTED_PROXIES so the
# client IP is taken from X-Forwarded-For (it is shortened before any use).
# Page caches in front of the tracked site must bypass /stats/ (see varnish.vcl.snippet).

# Inside the tracked site's `server { ... }` block:
location ^~ /stats/ {
    proxy_pass https://stats.example.net/t/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name stats.example.net;
    proxy_set_header Host stats.example.net;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # The tracker is cookie-less server-side: never forward the site's cookies,
    # never let a Set-Cookie through.
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    client_max_body_size 128k;
    access_log off;
}

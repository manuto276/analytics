# analytics — nginx vhost for a managed PHP host (tarball deploy with ./console)
#
# Replace:
#   stats.example.net                          service host name (APP_URL)
#   /home/site/htdocs/stats.example.net        deploy root (directory containing ./console)
#   unix:/run/php/php8.4-fpm-site.sock         the site's PHP-FPM pool (runs as the site user)
#
# Key points
# - The web root is <deploy root>/current/public; `current` is a symlink switched atomically
#   by ./console. PHP gets $realpath_root (the resolved releases/<TS>/public), so OPcache
#   caches per release path and a new release is served without reloading PHP-FPM.
# - Only /api/, /t/ and /_ops/ reach PHP; everything else is the static dashboard (SPA).
# - Tracking requests (/t/) are logged without client IP or user agent (or not at all).
# - Disable any panel page cache (Varnish) for this site.

# http {} context (panels usually allow it in the vhost file, outside `server`).
# No $remote_addr, no $http_user_agent, path without query string.
log_format analytics_anon '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name stats.example.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.example.net;

    ssl_certificate     /etc/nginx/ssl-certificates/stats.example.net.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/stats.example.net.key;

    root /home/site/htdocs/stats.example.net/current/public;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    # Dashboard access log: prefer the anonymised format here as well if IPs are not needed.
    access_log /home/site/logs/nginx/access.log analytics_anon;
    error_log  /home/site/logs/nginx/error.log;

    # Static SPA: unknown paths fall back to the Nuxt entry point.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /200.html {
        add_header Cache-Control "no-cache" always;
    }

    # The consent-banner preview framed by the dashboard: PHP serves it with its own strict CSP and
    # frame-ancestors 'self', which a static file would not carry.
    location = /_preview/banner.html {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm-site.sock;
    }

    # Hashed Nuxt build assets never change.
    location ^~ /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # JSON API (dashboard + server-side conversions API).
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm-site.sock;
    }

    # Tracker script and collection endpoints: anonymised log (or `access_log off;`).
    location ^~ /t/ {
        access_log /home/site/logs/nginx/tracking.log analytics_anon;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm-site.sock;
    }

    # Operations endpoints (e.g. token-protected POST /_ops/opcache-reset): localhost only.
    location ^~ /_ops/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm-site.sock;
    }

    # Never serve other PHP files or dotfiles directly.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

; The whole FPM runs as the site user (no root master), like a per-site pool;
; the user/group directives of www.conf are ignored when not started as root.
[www]
listen = 9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes

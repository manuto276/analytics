# Deploy smoke test stack (see smoke.sh). Not for production.
name: analytics-smoke

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: analytics
      MYSQL_USER: analytics
      MYSQL_PASSWORD: analytics
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 90

  php:
    build:
      context: .
      target: php
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - deploy-root:/home/site/htdocs/stats.example.test

  web:
    build:
      context: .
      target: web
    depends_on:
      - php
    ports:
      - "127.0.0.1:${SMOKE_HTTP_PORT:-8089}:80"
    volumes:
      - deploy-root:/home/site/htdocs/stats.example.test:ro

volumes:
  deploy-root:

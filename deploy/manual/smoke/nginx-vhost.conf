# Smoke vhost: same rules as deploy/examples/nginx-vhost.conf, plain HTTP, php:9000 upstream.
log_format analytics_anon '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;

    root /home/site/htdocs/stats.example.test/current/public;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/analytics-php.conf;
    }

    location ^~ /t/ {
        access_log /var/log/nginx/access.log analytics_anon;
        include /etc/nginx/snippets/analytics-php.conf;
    }

    location ^~ /_ops/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/analytics-php.conf;
    }

    location ~ /\. {
        deny all;
    }
}

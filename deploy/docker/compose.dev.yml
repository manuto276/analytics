# analytics — development overlay (use with compose.base.yml).
#
#   make up            https://analytics.test:8443  and  http://localhost:8080
#   make sh            a shell in the php container
#   make up PROFILES=redis,mail  optional Redis and Mailpit
#
# Add to /etc/hosts:  127.0.0.1 analytics.test
# Certificates:       make certs   (deploy/docker/certs/gen-certs.sh)
#
# The dashboard normally runs on the host (`pnpm dev` with nitro.devProxy → 8080);
# the optional `node` service below does the same inside the stack.

services:
  mysql:
    ports:
      # 33061 belongs to the standalone dev database used by local PHPUnit runs.
      - "127.0.0.1:33062:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql

  php:
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_URL: https://analytics.test:8443
      LOG_LEVEL: debug
      APP_SECRET: ZGV2LWRldi1kZXYtZGV2LWRldi1kZXYtZGV2LWRldjA=
      APP_ENCRYPTION_KEYS: k1:ZGV2LWtleS1kZXYta2V5LWRldi1rZXktZGV2LWtleTA=
      TRUSTED_PROXIES: 0.0.0.0/0
      INGEST_MODE: ${INGEST_MODE:-sync}
      REDIS_DSN: ${REDIS_DSN:-}
      MAILER_DSN: ${MAILER_DSN:-}
      TEST_DATABASE_URL: mysql://root:root@mysql:3306/analytics_test

  nginx:
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  # Optional: the Nuxt dev server inside the stack (profile `node`).
  node:
    image: node:24-slim
    profiles: ["node"]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /src/services/dashboard
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /tmp/corepack
      HOME: /tmp
      NUXT_PUBLIC_API_BASE: https://analytics.test:8443
    volumes:
      - ../..:/src
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "corepack pnpm install && corepack pnpm dev --host 0.0.0.0"]

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  mysql-dev-data:

# analytics — production web image (deploy/docker/Dockerfile, stage nginx-runtime).
#
# The image carries the static dashboard at /app/public; PHP runs in the `app`
# container (php-runtime) with the identical release tree at /app, so
# $realpath_root resolves to the same path on both sides.
#
# Routing rule of thumb:
#   * hashed build assets (/_nuxt/, /_fonts/) and any other file with an asset
#     extension are served by nginx, immutable where the name is content-hashed;
#   * everything else — including `/`, every deep link and /robots.txt — goes to
#     PHP, which returns public/index.html with the application CSP (the inline
#     script hashes of config/csp.php), an ETag and `Cache-Control: no-cache`.
#
# TLS is expected to terminate in front of this container (reverse proxy /
# ingress); set TRUSTED_PROXIES in the application env so the real client IP is
# read from X-Forwarded-For before it is shortened.

include /etc/nginx/snippets/anon-log.conf;

upstream php_upstream {
    server app:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /app/public;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    access_log /dev/stdout analytics_anon;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed build assets: cached forever, never fall back to the SPA.
    location ^~ /_nuxt/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /_fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # JSON API (dashboard and server-side conversions API).
    location ^~ /api/ {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    # Tracker script and collection endpoints: anonymised log.
    location ^~ /t/ {
        access_log /dev/stdout analytics_anon;
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    # Operations endpoints (POST /_ops/opcache-reset): private networks only.
    location ^~ /_ops/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    # Other static assets (images, styles, fonts, manifests). A missing file
    # falls through to PHP, which answers 404 as a JSON problem or serves
    # /robots.txt.
    location ~* \.(?:css|js|mjs|map|json|txt|xml|webmanifest|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        try_files $uri @php;
    }

    # Documents: the SPA shell rendered by the application.
    location / {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    location @php {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }
}

# analytics — development site (compose.base.yml + compose.dev.yml).
#
# https://analytics.test:8443 and plain HTTP on 8080 (handy for curl and for the
# Nuxt dev server proxy). Certificates come from deploy/docker/certs
# (`make certs`); add analytics.test to /etc/hosts.
#
# The document root is the bind-mounted services/api/public: `pnpm generate:api`
# in services/dashboard drops the SPA next to index.php. Documents are rendered
# by PHP (SPA fallback with the application CSP); only assets are static.

include /etc/nginx/snippets/anon-log.conf;

upstream php_upstream {
    server php:9000;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name analytics.test localhost;

    ssl_certificate     /etc/nginx/certs/analytics.test.pem;
    ssl_certificate_key /etc/nginx/certs/analytics.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /app/public;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    access_log /dev/stdout analytics_anon;
    error_log /dev/stderr info;

    # Content-hashed build assets: cached forever, never fall back to the SPA.
    location ^~ /_nuxt/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /_fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # JSON API (dashboard and server-side conversions API).
    location ^~ /api/ {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    # Tracker script and collection endpoints: anonymised log.
    location ^~ /t/ {
        access_log /dev/stdout analytics_anon;
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    # Operations endpoints (POST /_ops/opcache-reset): private networks only.
    location ^~ /_ops/ {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    # Other static assets (images, styles, fonts, manifests). A missing file
    # falls through to PHP, which answers 404 as a JSON problem or serves
    # /robots.txt.
    location ~* \.(?:css|js|mjs|map|json|txt|xml|webmanifest|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        try_files $uri @php;
    }

    # Documents: the SPA shell rendered by the application.
    location / {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }

    location @php {
        include /etc/nginx/snippets/php-fastcgi.conf;
        fastcgi_pass php_upstream;
    }
}

# Anonymised access log format (http context).
#
# No $remote_addr, no $http_user_agent, no query string: nothing that could
# identify a visitor leaves the tracking endpoints in a log file. The same
# format is used for the dashboard, where client IPs are not needed either.
log_format analytics_anon '[$time_iso8601] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';

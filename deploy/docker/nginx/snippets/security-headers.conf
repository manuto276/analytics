# Baseline headers for responses nginx serves itself (static SPA files).
#
# Responses produced by PHP carry the application headers (CSP with the inline
# script hashes from config/csp.php, HSTS, COOP, Permissions-Policy); nginx must
# not weaken those, so this snippet is only included in static locations.
#
# add_header is not inherited by a location that declares its own headers:
# include this snippet again in every location that adds one.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

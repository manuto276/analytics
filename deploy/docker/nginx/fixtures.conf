# Static fixture sites for the end-to-end suite (compose.test.yml, service `fixtures`).
#
# Four tracked-site personalities, all over HTTPS with the local test CA:
#   www.site.test     classic multi-page site (snippet from analytics.test)
#   app.site.test     small SPA using history.pushState (same cookie domain .site.test)
#   other.test        origin that is NOT registered for the site (collect must refuse it)
#   proxy.site.test   same-origin proxy path /stats/ → https://analytics.test/t/
#
# /site-key.js is written by the e2e global setup with the public key of the site
# created for the run, so the fixture pages contain no hard-coded key.

include /etc/nginx/snippets/anon-log.conf;

server {
    listen 443 ssl default_server;
    listen 80 default_server;
    http2 on;
    server_name www.site.test site.test;

    ssl_certificate     /etc/nginx/certs/fixtures.pem;
    ssl_certificate_key /etc/nginx/certs/fixtures.key;

    root /fixtures/www.site.test;
    index index.html;
    charset utf-8;
    access_log /dev/stdout analytics_anon;

    location = /site-key.js {
        default_type application/javascript;
        alias /fixtures/site-key.js;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 443 ssl;
    listen 80;
    http2 on;
    server_name app.site.test;

    ssl_certificate     /etc/nginx/certs/fixtures.pem;
    ssl_certificate_key /etc/nginx/certs/fixtures.key;

    root /fixtures/app.site.test;
    index index.html;
    charset utf-8;
    access_log /dev/stdout analytics_anon;

    location = /site-key.js {
        default_type application/javascript;
        alias /fixtures/site-key.js;
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: every unknown path renders the SPA shell.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen 80;
    http2 on;
    server_name other.test;

    ssl_certificate     /etc/nginx/certs/fixtures.pem;
    ssl_certificate_key /etc/nginx/certs/fixtures.key;

    root /fixtures/other.test;
    index index.html;
    charset utf-8;
    access_log /dev/stdout analytics_anon;

    location = /site-key.js {
        default_type application/javascript;
        alias /fixtures/site-key.js;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }
}

server {
    listen 443 ssl;
    listen 80;
    http2 on;
    server_name proxy.site.test;

    ssl_certificate     /etc/nginx/certs/fixtures.pem;
    ssl_certificate_key /etc/nginx/certs/fixtures.key;

    root /fixtures/proxy.site.test;
    index index.html;
    charset utf-8;
    access_log /dev/stdout analytics_anon;

    location = /site-key.js {
        default_type application/javascript;
        alias /fixtures/site-key.js;
        add_header Cache-Control "no-store" always;
    }

    # First-party proxy: the tracker is loaded from /stats/<key>.js and posts to
    # /stats/e, so the browser only ever talks to proxy.site.test.
    location ^~ /stats/ {
        proxy_pass https://analytics.test/t/;
        proxy_ssl_server_name on;
        proxy_ssl_name analytics.test;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
        proxy_set_header Host analytics.test;
        proxy_set_header Origin https://proxy.site.test;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }
}

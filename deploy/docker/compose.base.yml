# analytics — shared definition of the local stacks.
#
# Never used alone; always combined with an overlay:
#   dev   docker compose -p analytics-dev  -f compose.base.yml -f compose.dev.yml  …
#   test  docker compose -p analytics-test -f compose.base.yml -f compose.test.yml …
#
# Production has its own self-contained file (compose.prod.yml).

name: analytics

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: analytics
      MYSQL_USER: analytics
      MYSQL_PASSWORD: analytics
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

  php:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: php-dev
    # Runs as the owner of the bind-mounted sources (Makefile exports the caller's uid).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../../services/api:/app
      - ../../docs:/docs:ro
    environment:
      APP_URL: https://analytics.test
      DATABASE_URL: mysql://analytics:analytics@mysql:3306/analytics?serverVersion=8.4
      COMPOSER_CACHE_DIR: /tmp/composer-cache

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - php
    volumes:
      - ../../services/api:/app:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

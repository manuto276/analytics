# analytics — test overlay (use with compose.base.yml), plan §13.1.
#
#   docker compose -p analytics-test -f compose.base.yml -f compose.test.yml …
#   (the Makefile wraps every invocation: make test-unit, make test-e2e, …)
#
# Nothing is published on the host: the suites run inside the network, so the
# stack never collides with the dev stack or with the standalone dev database.
# Host names are network aliases, which is why the Playwright container can
# reach https://analytics.test and https://www.site.test directly.

x-php-test-env: &php-test-env
  APP_ENV: test
  APP_URL: https://analytics.test
  LOG_LEVEL: debug
  APP_SECRET: dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QwMDA=
  APP_ENCRYPTION_KEYS: k1:dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktdGVzdDA=
  DATABASE_URL: mysql://root:root@mysql:3306/analytics_test
  TEST_DATABASE_URL: mysql://root:root@mysql:3306/analytics_test
  TRUSTED_PROXIES: 0.0.0.0/0
  REDIS_DSN: ${REDIS_DSN:-}
  INGEST_MODE: ${INGEST_MODE:-sync}
  DB_PARTITIONING: ${DB_PARTITIONING:-true}
  APP_TEST_CLOCK: ${APP_TEST_CLOCK:-}
  TEST_TOKEN: ${TEST_TOKEN:-}

services:
  mysql:
    # Throw-away data on tmpfs; durability is irrelevant and slows the suites down.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=0
      - --sync-binlog=0
      - --skip-log-bin
      - --max-connections=500
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: analytics_test
    tmpfs:
      - /var/lib/mysql:rw,size=1g

  php:
    environment: *php-test-env

  # Test-only: lets the Playwright container (which has no docker client) run
  # allow-listed `bin/analytics` commands over the compose network.
  # See services/e2e/support/console-bridge.php.
  console:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: php-dev
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../../services/api:/app
      - ../../services/e2e:/e2e:ro
    environment: *php-test-env
    command: ["php", "-S", "0.0.0.0:8099", "/e2e/support/console-bridge.php"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8099/health') ? 0 : 1);"]
      interval: 3s
      timeout: 5s
      retries: 20

  nginx:
    volumes:
      - ./nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - analytics.test

  # The tracked sites of the end-to-end suite (services/e2e/fixtures).
  fixtures:
    image: nginx:1.29-alpine
    depends_on:
      - nginx
    volumes:
      - ../../services/e2e/fixtures:/fixtures:ro
      - ./nginx/fixtures.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - site.test
          - www.site.test
          - app.site.test
          - other.test
          - proxy.site.test

  # Tracker and dashboard toolchain (pnpm) for `make test-tracker`, `make size`, …
  node:
    image: node:24-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /src
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "1"
      # The container runs as the host user, whose home does not exist inside it.
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ../..:/src
      # Linux dependencies of their own: the host installs the same packages for
      # macOS, and pnpm's symlink farm is not portable between the two.
      - node-modules-tracker:/src/services/tracker/node_modules
      - node-modules-dashboard:/src/services/dashboard/node_modules
      - node-modules-e2e:/src/services/e2e/node_modules
    command: ["sleep", "infinity"]

  # Pinned to the version of @playwright/test in services/e2e/package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /e2e
    depends_on:
      - nginx
      - fixtures
      - console
    environment:
      CI: "1"
      # Node (not the browsers) trusts the local CA; the browser contexts use
      # ignoreHTTPSErrors, see services/e2e/playwright.config.ts.
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
      E2E_BASE_URL: https://analytics.test
      E2E_CONSOLE_URL: http://console:8099
      ANALYTICS_PUBLIC_KEY: ${ANALYTICS_PUBLIC_KEY:-}
      HOME: /tmp
    volumes:
      - ../../services/e2e:/e2e
      - node-modules-e2e:/e2e/node_modules
      - ./certs:/certs:ro
    # Every fixture host resolves through the compose network aliases above.
    command: ["sleep", "infinity"]

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Linux node_modules for the containers, kept out of the macOS/host tree.
  # pnpm's content-addressable store stays in the repository (.pnpm-store, git-ignored).
  node-modules-tracker:
  node-modules-dashboard:
  node-modules-e2e:

; Development and test containers (deploy/docker/Dockerfile, stage php-dev).
; Fast feedback over throughput: sources are re-read on every request.

memory_limit = 512M
max_execution_time = 60
post_max_size = 2M
upload_max_filesize = 2M
expose_php = Off
date.timezone = UTC

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; pcov is the coverage driver of the test suites (enabled per run by phpunit).
pcov.enabled = 0
pcov.directory = /app/src

realpath_cache_size = 4096K
realpath_cache_ttl = 60

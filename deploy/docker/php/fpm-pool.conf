; Pool used by every PHP-FPM container of this project.
; The process runs as the `app` user (uid 1000); the release tree is owned by it.
[www]
user = app
group = app
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Used by the container healthcheck (deploy/docker/scripts/fpm-healthcheck.sh).
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

; No client IP or user agent in the access log: tracking requests must stay anonymous.
access.log = /proc/self/fd/2
access.format = "%{%Y-%m-%dT%H:%M:%S%z}t \"%m %r\" %s %{mili}dms %{kilo}Mkb"
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

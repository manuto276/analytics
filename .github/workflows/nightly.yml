name: Nightly

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: analytics_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/analytics_test
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, mbstring, sodium, zip
          coverage: pcov
          ini-values: memory_limit=1G
      - name: Install
        working-directory: services/api
        run: composer install --no-interaction --no-progress
      - name: Infection
        working-directory: services/api
        run: |
          if [ ! -x vendor/bin/infection ]; then
            echo "::warning::infection/infection is not a dev dependency yet; skipping"
            exit 0
          fi
          vendor/bin/infection --threads=max --min-msi=80 --no-progress

  browsers:
    name: Full browser matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - name: Certificates
        run: ./deploy/docker/certs/gen-certs.sh
      - name: Tracker and dashboard artefacts
        run: |
          corepack enable
          (cd services/tracker && pnpm install --frozen-lockfile && pnpm build:api)
          (cd services/dashboard && pnpm install --frozen-lockfile && pnpm generate:api)
      - name: Stack
        run: make e2e-setup
      - name: Suite (chromium, firefox, webkit)
        run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-nightly
          path: services/e2e/playwright-report/
          retention-days: 14
      - name: Tear down
        if: always()
        run: make down

  upgrade-migrations:
    name: Upgrade from the previous tag
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: analytics_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/analytics_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, mbstring, sodium, zip
          coverage: none
      - name: Migrate the previous tag, then HEAD
        run: |
          previous=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$previous" ]; then
            echo "::notice::no release tag yet; nothing to upgrade from"
            exit 0
          fi
          git checkout "$previous" -- services/api
          (cd services/api && composer install --no-interaction --no-progress \
            && php bin/analytics migrations:migrate --no-interaction --allow-no-migration)
          git checkout HEAD -- services/api
          (cd services/api && composer install --no-interaction --no-progress \
            && php bin/analytics migrations:migrate --no-interaction --allow-no-migration \
            && vendor/bin/phpunit --testsuite migrations)

  audits:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Composer audit
        working-directory: services/api
        run: |
          composer install --no-interaction --no-progress
          composer audit
      - name: pnpm audit
        run: |
          corepack enable
          (cd services/tracker && pnpm install --frozen-lockfile && pnpm audit --audit-level moderate) || true
          (cd services/dashboard && pnpm install --frozen-lockfile && pnpm audit --audit-level moderate) || true
          (cd services/sdk/browser && pnpm install --frozen-lockfile && pnpm audit --audit-level moderate) || true
          (cd services/sdk/node && pnpm install --frozen-lockfile && pnpm audit --audit-level moderate) || true

  sdk:
    name: SDKs (full suites, Node SDK on every supported Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Browser SDK
        working-directory: services/sdk/browser
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm tracker-types:check
          pnpm test:coverage
          pnpm build
          pnpm pack:check
      - name: Node SDK
        working-directory: services/sdk/node
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm openapi-types:check
          pnpm test:coverage
          pnpm build
          pnpm pack:check
      - name: Node SDK build on Node 18, 20 and 22
        working-directory: services/sdk/node
        run: |
          for v in 18 20 22; do
            docker run --rm -v "$PWD:/sdk:ro" -w /sdk "node:$v-slim" sh -c 'node scripts/smoke.mjs && node scripts/smoke.cjs'
          done

  wordpress-plugin:
    name: WordPress plugin smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Plugin admin app builds, and build/ is its build
        working-directory: services/wordpress-plugin/analytics-connector
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint:js
          git diff --exit-code -- build

      - name: Plugin PHP syntax
        run: |
          find services/wordpress-plugin -name '*.php' -not -path '*/node_modules/*' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "plugin files parse"

      - name: Plugin unit tests (Brain Monkey)
        working-directory: services/wordpress-plugin/analytics-connector/tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit

      - name: WordPress smoke (real WordPress + wp-cli)
        env:
          WP_SMOKE_PORT: '8091'
        run: ./services/wordpress-plugin/analytics-connector/tests/smoke/smoke.sh

  load:
    name: Load baseline (informative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Seed and run k6
        # Informative: the plan's budgets (collect p95 < 50 ms at 100 rps,
        # reports p95 < 500 ms) are reported, never a build gate — a shared CI
        # runner is not a performance reference.
        continue-on-error: true
        env:
          SEED_EVENTS: '1000000'
          PERF_DAYS: '60'
          DURATION: '120s'
        run: make perf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: services/e2e/perf/summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: make down

  zap:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Start the production stack
        run: ./deploy/docker/scripts/test-image.sh --keep
      - name: ZAP baseline
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8099 -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.html
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose -p analytics-image-test -f deploy/docker/compose.prod.yml down -v --remove-orphans || true
